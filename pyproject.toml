[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "satellit"
version = "1.0.0"
description = "Core-Satellite Trading-Pipeline: wöchentliche Trendfolge mit Regime-Ampel, Journal und Pushover"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jsonschema>=4.25",
    "requests>=2.31",
    "yfinance>=1.0",
]

[tool.setuptools]
packages = ["satellit"]
