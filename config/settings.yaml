# Parameter des Regelwerks — Spiegel von docs/TRADING_PLAN.md, Anhang A.
# Weichen Dokument und Datei voneinander ab, gilt das Dokument.
# Änderungen nur nach Abschnitt 12 des Trading-Plans (Monats-/Jahresreview, Changelog).

start:
  # Trading-Plan 10.1. Vorgabe sind zwei Wochenenden; beim Einrichten abwählbar (0 = kein
  # Trockenlauf). Betrifft ausschließlich den Satelliten — der Kern startet immer sofort.
  trockenlauf_tage: 14

portfolio:
  core_share: 0.90
  satellite_share: 0.10
  satellite_band_low: 0.07      # unter 7 %  -> im Januar auffüllen (nur ohne Kill-Switch)
  satellite_band_high: 0.15     # über 15 %  -> Überschuss in den Kern
  max_core_stock_pct: 0.05      # Regel 3.3: je Kern-Aktie höchstens 5 % des Gesamtportfolios
  max_core_stocks_share: 0.20   # KERN.md 1: Einzelaktien höchstens 20 % des Kerns
  core_review_days: 180         # KERN.md 6: halbjährlicher Review je Kern-Aktie

universe:
  regions:
    US:
      name: "S&P 500"
      currency: USD
      # Quellen werden der Reihe nach probiert. Der referer holt vorher die Produktseite und
      # setzt die Cookies, die der iShares-CDN erwartet — ohne ihn kommt meist ein 403.
      # Link auf der Produktseite: "Positionen herunterladen" (CSV).
      quellen:
        # iShares Core S&P 500 UCITS ETF (SXR8), deutsche Seite. Geprüft 09/2026: 504 Titel.
        - typ: ishares_csv
          url: "https://www.ishares.com/de/privatanleger/de/produkte/253743/ishares-sp-500-b-ucits-etf-acc-fund/1478358465952.ajax?fileType=csv&fileName=SXR8_holdings&dataType=fund"
          referer: "https://www.ishares.com/de/privatanleger/de/produkte/253743/"
      local_file: "state/universe/SXR8_holdings.csv"   # Fallback: manuell heruntergeladene Datei
      index_symbol: "^GSPC"
      yahoo_suffix_default: ""
    EU:
      name: "STOXX Europe 600"
      currency: EUR
      quellen:
        # iShares STOXX Europe 600 UCITS ETF (DE) (EXSA). Geprüft 09/2026: 600 Titel.
        - typ: ishares_csv
          url: "https://www.ishares.com/de/privatanleger/de/produkte/251931/ishares-stoxx-europe-600-ucits-etf-de-fund/1478358465952.ajax?fileType=csv&fileName=EXSA_holdings&dataType=fund"
          referer: "https://www.ishares.com/de/privatanleger/de/produkte/251931/"
      local_file: "state/universe/EXSA_holdings.csv"
      index_symbol: "EXSA.DE"      # Index-Proxy für die EU-Ampel (ETF-Kurs, in EUR)
      yahoo_suffix_default: null   # wird aus der Börse abgeleitet
  refresh_days: 30                 # Konstituenten monatlich neu laden
  min_avg_turnover: 5000000        # Ø Tagesumsatz 20 T in Handelswährung
  max_price_pct_of_target: 0.40    # Stückpreis <= 40 % der Zielposition
  max_atr_pct: 0.06                # ATR(20)/Kurs <= 6 %
  min_history_days: 260

data:
  primary: yfinance                # yfinance | stooq | fixture
  # Stooq ist derzeit KEIN funktionierender Ersatz: der CSV-Endpunkt /q/d/l/ antwortet seit
  # 09/2026 mit 404 (geprüft ohne und mit Schlüssel; einen Schlüssel gibt es nicht zu holen).
  # Die tatsächliche Absicherung ist der Kurs-Cache in state/prices plus die Alterungsregel —
  # ab data.max_stale_age_days werden keine Kaufvorschläge mehr erzeugt.
  fallback: stooq
  max_stale_age_days: 7            # ältere Kurse -> keine neuen Kaufvorschläge
  cache_dir: state/prices
  history_days: 420                # Erstbefüllung
  batch_size: 80                   # Ticker je yfinance-Download
  batch_pause_seconds: 3
  max_stale_days: 5                # älter -> Warnung im Bericht
  fixture_dir: null                # nur für Tests/Demo

fundamentals:
  # Kennzahlen für den Kern-Kriterienkatalog (KERN.md 6). Nur dort verwendet — der Satellit
  # kennt keine Fundamentaldaten.
  primary: yfinance                # yfinance | synthetic | fixture | cache
  refresh_days: 90                 # Abschlüsse ändern sich quartalsweise; passt zum Kauffenster
  pause_seconds: 0.6               # je Titel ein eigener Abruf, es gibt keinen Batch-Endpunkt
  fixture_dir: null                # nur für Tests
  cache_dir: state/fundamentals

kern:
  # Schwellen des Kriterienkatalogs aus docs/KERN.md 6. Der Katalog ist ein Filter, kein
  # Score: ein Titel muss alle Muss-Kriterien erfüllen.
  min_roic: 0.10                   # Kriterium 3: ROIC/ROE nachhaltig > 10 %
  roic_jahre: 5                    # 5-Jahres-Durchschnitt
  max_net_debt_ebitda: 2.5         # Kriterium 4
  fcf_fenster: 10                  # Kriterium 5: positiv in mindestens 8 von 10 Jahren
  fcf_mindestens: 8
  min_jahre_notiert: 5             # Kriterium 6
  min_marktkap_eur: 5000000000     # Kriterium 6: > 5 Mrd. EUR
  wachstum_jahre: 5                # Kriterium 2: Umsatz und EPS über 5-10 Jahre gestiegen

signal:
  sma_fast: 50
  sma_slow: 200
  rs_lookbacks: [126, 252]
  rs_skip: 21
  rs_top_fraction: 0.10
  breakout_weeks: 20
  max_extension: 0.05
  max_new_entries:
    GREEN: 2
    YELLOW: 1
    RED: 0
  watchlist_below_breakout: 0.03   # Top-RS-Titel bis 3 % unter Ausbruch -> Watchlist

risk:
  risk_pct: 1.0
  risk_pct_start: 0.5
  start_trades: 20
  max_position_pct: 25
  max_positions: 5
  max_per_sector: 2
  max_open_risk_pct: 5.0
  atr_period: 20
  atr_stop_mult: 3.0
  soft_exit_weeks: 10
  yellow_risk_factor: 0.5

  # Bruchstücke. Der floor() in der Stückzahl und der Filter universe.max_price_pct_of_target
  # existieren nur, weil man ganze Aktien kaufen muss — mit Bruchstücken sind beide
  # gegenstandslos, und das Risiko je Trade bleibt exakt bei risk_pct. Trade Republic handelt
  # Bruchstücke auch bei Einmalorders (0,5 Anteile sind möglich), deshalb an.
  #
  # Offene Frage, die der Depotinhaber klären muss: ob sich auf eine Bruchstück-Position eine
  # ruhende Stop-Market-Order legen lässt (Anhang A: 360 Tage Gültigkeit). Geht das nicht,
  # wird der Stop nur im Wochenlauf geprüft und die Position ist zwischen zwei Läufen
  # ungesichert. Bei den Positionsgrößen, um die es hier geht, sind das Beträge im
  # einstelligen Euro-Bereich — die Regel bleibt trotzdem die Regel, und das Urteil weist
  # bei Bruchstücken ausdrücklich darauf hin.
  bruchstuecke: true

  # Kleinste sinnvolle Order. Keine Broker-Vorschrift, sondern eine Untergrenze gegen Unsinn:
  # ohne sie schlägt der Screener bei sehr kleinem Kapital Positionen von wenigen Cent vor,
  # die niemand ausführt. 1 EUR entspricht der Größenordnung, ab der Trade Republic
  # Bruchstücke bildet.
  min_order_eur: 1.0

  # Konzentrationsprofil für kleine Satelliten: wenige, größere Positionen statt fünf
  # unmöglich kleiner. Greift nur unterhalb der Schwelle; wächst der Satellit darüber
  # hinaus, gelten wieder die Werte oben. max_open_risk_pct bleibt in beiden Fällen
  # unverändert — das ist die Bremse gegen das höhere Klumpenrisiko.
  kleines_depot_unter_eur: 2000
  klein:
    max_positions: 2
    max_position_pct: 50
    max_per_sector: 1

regime:
  us:
    green_min: 60
    yellow_min: 40
    veto_below: 40
    hysteresis_weeks: 2
  eu:
    green_p200: 0.55
    red_p200: 0.40
    red_p50: 0.40
    hysteresis_weeks: 2

kill_switch:
  max_drawdown: 0.25
  min_trades: 30

schedule:
  weekday: 5          # 0=Montag ... 5=Samstag
  hour: 8
  minute: 0
  timezone: Europe/Berlin

paths:
  state_dir: state
  theses_dir: state/theses
  reports_dir: state/reports
  regime_dir: state/regime
  universe_dir: state/universe
  exclusions_file: config/exclusions.yaml
  symbol_overrides_file: config/symbol_overrides.yaml
  vendor_skills_dir: vendor/claude-trading-skills/skills
