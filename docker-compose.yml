# Variablen kommen aus der lokalen .env (Compose lädt sie automatisch) oder,
# bei Portainer, aus den Stack-Umgebungsvariablen im UI. Kein env_file:, sonst
# schlägt der Deploy fehl, sobald keine .env im Stack-Verzeichnis liegt.
#
# Das Dashboard hängt hinter Traefik (kein Port-Mapping auf den Host).
# Erreichbar unter DASHBOARD_HOST, Standard: satellit.silasbeckmann.de

services:
  satellit:
    build: .
    image: satellit:latest
    pull_policy: build   # lokal bauen, nicht von Docker Hub ziehen
    container_name: satellit
    restart: unless-stopped
    environment:
      - TZ=${SATELLIT_TZ:-Europe/Berlin}
      - SATELLIT_TZ=${SATELLIT_TZ:-Europe/Berlin}
      - SATELLIT_API_TOKEN=${SATELLIT_API_TOKEN:?fehlt - geteiltes Geheimnis Dashboard <-> API, z. B. openssl rand -hex 32}
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN:-}
      - PUSHOVER_USER=${PUSHOVER_USER:-}
      - DASHBOARD_URL=${DASHBOARD_URL:-https://${DASHBOARD_HOST:-satellit.silasbeckmann.de}}
      - STOOQ_APIKEY=${STOOQ_APIKEY:-}
    volumes:
      - ./state:/app/state      # Journal, Kurs-Cache, Berichte, Ampel-Historie
      - ./config:/app/config    # settings.yaml, exclusions.yaml, symbol_overrides.yaml
    expose:
      - "8787"                  # Dashboard-API, nur im internen Netz
    command: ["serve"]          # Scheduler (Samstag 08:00) + API
    networks:
      - internal
    labels:
      - "traefik.enable=false"  # API bleibt intern, nie über den Proxy

  dashboard:
    build: ./dashboard
    image: satellit-dashboard:latest
    pull_policy: build   # lokal bauen, nicht von Docker Hub ziehen
    container_name: satellit-dashboard
    restart: unless-stopped
    environment:
      - TZ=${SATELLIT_TZ:-Europe/Berlin}
      - DATA_DIR=/data
      - SATELLIT_API_URL=http://satellit:8787
      - SATELLIT_API_TOKEN=${SATELLIT_API_TOKEN:?fehlt - muss identisch zum Wert im satellit-Container sein}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?fehlt - Login-Passwort, lang und zufaellig}
      - SESSION_SALT=${SESSION_SALT:?fehlt - beliebige Zufallszeichenkette fuer das Session-Cookie}
    volumes:
      - ./state:/data:ro        # Dashboard liest nur; schreiben geht über die API
    depends_on:
      - satellit
    networks:
      - internal               # erreicht satellit:8787
      - traefik_proxy_net      # erreichbar für Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy_net"
      # Router
      - "traefik.http.routers.satellit.rule=Host(`${DASHBOARD_HOST:-satellit.silasbeckmann.de}`)"
      - "traefik.http.routers.satellit.entrypoints=web,websecure"
      - "traefik.http.routers.satellit.tls=true"
      - "traefik.http.routers.satellit.middlewares=satellit@docker"
      # Service — Container-Port, nicht auf dem Host veröffentlicht
      - "traefik.http.services.satellit.loadbalancer.server.port=3000"
      # Security-Header, wie beim n8n-Stack
      - "traefik.http.middlewares.satellit.headers.SSLRedirect=true"
      - "traefik.http.middlewares.satellit.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.satellit.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.satellit.headers.STSPreload=true"
      - "traefik.http.middlewares.satellit.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.satellit.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.satellit.headers.contentTypeNosniff=true"

networks:
  internal:
  traefik_proxy_net:
    external: true
